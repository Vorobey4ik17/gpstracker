<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<title>GPS Диспетчер</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: rgba(255,255,255,.95); border-radius: 10px; padding: 12px 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25); max-width: 300px;
  }
  #panel h3 { margin: 0 0 8px; font-size: 16px; }
  #panel input { width: 140px; padding: 4px 6px; }
  #panel button { padding: 4px 10px; }
  #status { margin-top: 8px; font-size: 13px; color: #555; }
  #info { margin-top: 6px; font-size: 13px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h3>🛰 GPS Диспетчер</h3>
  <div>
    <input id="deviceId" value="device-001" placeholder="device id"/>
    <button id="load">Показать трек</button>
  </div>
  <div id="status">Подключение…</div>
  <div id="info"></div>
</div>
<script>
const map = L.map("map").setView([50, 40], 3); // весь мир

// Гибрид: спутник + схема с подписями поверх
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, attribution: "Esri, Maxar, Earthstar Geographics"
}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19
}).addTo(map);

const COLORS = ["#00ffff", "#ff44ff", "#ffff00", "#ff8800", "#ffffff", "#7CFC00"];
const markers = {}, tracks = {};
let colorIdx = 0;

function colorFor(d) {
  colorFor.cache = colorFor.cache || {};
  if (!colorFor.cache[d]) colorFor.cache[d] = COLORS[colorIdx++ % COLORS.length];
  return colorFor.cache[d];
}

function upsertPoint(row, follow) {
  const d = row.device_id;
  const ll = [row.lat, row.lon];
  if (!markers[d]) {
    markers[d] = L.marker(ll, {
      icon: L.divIcon({
        className: "",
        html: '<span style="display:block;width:14px;height:14px;border-radius:50%;background:' + colorFor(d) + ';box-shadow:0 0 10px ' + colorFor(d) + ';border:2px solid #000"></span>',
        iconSize: [14, 14], iconAnchor: [7, 7]
      })
    }).addTo(map).bindPopup(d);
    tracks[d] = { line: L.polyline([], { color: colorFor(d), weight: 4 }).addTo(map), pts: [] };
  }
  markers[d].setLatLng(ll);
  tracks[d].pts.push(ll);
  tracks[d].line.setLatLngs(tracks[d].pts);
  if (follow) map.setView(ll, 14);
  const t = new Date((row.created_at || Date.now() / 1000) * 1000).toLocaleTimeString();
  document.getElementById("info").innerHTML =
    "<b>" + d + "</b><br>скорость: " + (+row.speed || 0).toFixed(1) + " км/ч<br>" +
    "точность: ±" + Math.round(row.accuracy || 0) + " м<br>обновлено: " + t;
}

async function loadHistory(deviceId) {
  const res = await fetch("/history?device=" + encodeURIComponent(deviceId));
  if (!res.ok) { setStatus("Ошибка истории: HTTP " + res.status); return; }
  const data = await res.json();
  if (tracks[deviceId]) {
    map.removeLayer(tracks[deviceId].line); tracks[deviceId] = null;
    if (markers[deviceId]) { map.removeLayer(markers[deviceId]); markers[deviceId] = null; }
  }
  data.forEach(r => upsertPoint(r, false));
  // показать весь маршрут: карта обрамляет трек
  if (tracks[deviceId] && tracks[deviceId].pts.length) {
    map.fitBounds(tracks[deviceId].line.getBounds(), { padding: [40, 40] });
  }
}

function setStatus(t) { document.getElementById("status").textContent = t; }

document.getElementById("load").onclick = () =>
  loadHistory(document.getElementById("deviceId").value.trim());

const socket = io();
socket.on("connect", () => setStatus("Онлайн, ждём данные…"));
socket.on("disconnect", () => setStatus("Связь с сервером потеряна"));
socket.on("point", row => {
  const isNew = !markers[row.device_id];
  upsertPoint(row, isNew);
  setStatus("Онлайн • " + new Date().toLocaleTimeString());
});

loadHistory("device-001");
</script>
</body>
</html>
